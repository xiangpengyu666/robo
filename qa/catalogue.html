<!doctype html><meta charset="utf-8"><title>打印部件命名核对</title><style>body{margin:0;background:#edf0e8;font:13px sans-serif}main{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}article{height:164px;text-align:center}canvas{width:100%;height:140px;display:block}</style><main></main><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {BOM_PARTS} from '../src/bom-config.js';
const asset=await new GLTFLoader().loadAsync('/models/robocam.glb');let n=0;asset.scene.traverse(m=>{if(!m.isMesh)return;const id=m.userData.partId||`part-${++n}`;if(BOM_PARTS[id] || !['part-2','part-3','part-5'].includes(id))return;const card=document.createElement('article');const canvas=document.createElement('canvas');card.append(canvas,document.createTextNode(id));document.querySelector('main').append(card);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(240,140,false);const scene=new THREE.Scene();scene.background=new THREE.Color('#edf0e8');const geo=m.geometry.clone();geo.computeBoundingBox();const center=geo.boundingBox.getCenter(new THREE.Vector3());geo.translate(-center.x,-center.y,-center.z);const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:'#89959d',roughness:.7}));const scale=2/Math.max(...geo.boundingBox.getSize(new THREE.Vector3()).toArray());mesh.scale.setScalar(scale);scene.add(mesh,new THREE.HemisphereLight(0xffffff,0x444444,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);const camera=new THREE.PerspectiveCamera(36,240/140,.01,100);camera.position.set(3,2,4);camera.lookAt(0,0,0);renderer.render(scene,camera);});
</script>
